<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <!-- Full bleed for maskable safe-zone -->
  <rect width="512" height="512" fill="url(#maskGrad)"/>
  <!-- Concentric circle inside safe area (within 80% boundary) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldMask)" stroke-width="4" stroke-dasharray="6 4" opacity="0.6"/>
  <!-- Open Book Icon centered inside safe margin -->
  <g transform="translate(146, 156)" fill="none" stroke="url(#goldMask)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 190 C78 166, 40 162, 8 170 L8 32 C40 24, 78 28, 110 52 Z" fill="#064e3b" fill-opacity="0.7"/>
    <path d="M110 190 C142 166, 180 162, 212 170 L212 32 C180 24, 142 28, 110 52 Z" fill="#064e3b" fill-opacity="0.7"/>
    <line x1="110" y1="52" x2="110" y2="190" stroke="#f59e0b" stroke-width="10"/>
  </g>
  <path d="M256 100 A22 22 0 0 0 272 134 A26 26 0 1 1 256 100 Z" fill="url(#goldMask)"/>
</svg>
